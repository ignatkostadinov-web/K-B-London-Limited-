name: Deploy development previews

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}development/
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble client and staff previews
        run: |
          mkdir -p _site/development
          cp index.html staff.html login.html development/projects.js _site/development/
          cp -R assets _site/development/
          mkdir -p _site/development/supabase
          cp supabase/config.js _site/development/supabase/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy development preview
        id: deployment
        uses: actions/deploy-pages@v4
