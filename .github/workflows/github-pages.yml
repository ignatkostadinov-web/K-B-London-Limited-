name: Deploy portal to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble portal frontend
        run: |
          mkdir -p _site/supabase
          cp index.html login.html staff.html client-portal.js staff-portal.js projects.js _site/
          cp supabase/config.js supabase/portal.js _site/supabase/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy portal
        id: deployment
        uses: actions/deploy-pages@v4
